name=UltronVoice
version=0.1.3

author=franzemil
maintainer=franzemil
sentence=Wake word ("hey ultron") + command recognition for the XIAO ESP32S3 Sense: PDM capture, MFCC, TFLite-Micro and the two-stage state machine, behind one poll() call.
paragraph=Wraps the whole voice pipeline so a sketch only contains application logic. Thresholds, class order and the trained command table come from a generated ultron_config.h (model/thresholds.json + model/registry.json); model bytes from a generated model_data.h. Emits the spec 003 Target Event Contract (EVT WAKE/CMD/TIMEOUT/ERROR) plus DBG pred lines on any Stream. Static buffers only; no allocation on the inference path.
category=Data Processing
url=https://github.com/franzemil/ultron
architectures=esp32
includes=UltronVoice.h
