name: dsp-release

# Builds the shared C MFCC library for every supported host platform and
# attaches the archives to the GitHub Release for the pushed tag, so
# compiler-less machines can run `make -C dsp fetch` (see dsp/Makefile).
#
# Artifacts (per release, tar.gz containing libmfcc.{so|dll} + libmfcc.a):
#   libmfcc-macos-arm64.tar.gz    (macos-14, native)
#   libmfcc-linux-x86_64.tar.gz   (ubuntu-24.04, native)
#   libmfcc-linux-aarch64.tar.gz  (ubuntu-24.04-arm, native)
#   libmfcc-win64.tar.gz          (windows-latest, MinGW-w64 UCRT64 via MSYS2)
# plus SHA256SUMS. workflow_dispatch builds without tagging: archives land on
# the run page as workflow artifacts for testing, no release is touched.
#
# Note: asset names are intentionally tag-free so that the stable
# `releases/latest/download/<asset>` redirect works for `make fetch`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: libmfcc (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         host: macos-arm64 }
          - { os: ubuntu-24.04,     host: linux-x86_64 }
          - { os: ubuntu-24.04-arm, host: linux-aarch64 }
          - { os: windows-latest,   host: win64, msys2: true }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc

      - name: Build & pack (Windows)
        if: matrix.msys2
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -C dsp libmfcc.a libmfcc.dll
          mkdir -p dsp/dist
          tar -czf "dsp/dist/libmfcc-${{ matrix.host }}.tar.gz" \
              -C dsp/build libmfcc.dll libmfcc.a
          cd dsp/dist
          (sha256sum libmfcc-* || shasum -a 256 libmfcc-*) > SHA256SUMS

      - name: Build & pack (POSIX)
        if: ${{ !matrix.msys2 }}
        run: |
          set -euo pipefail
          make -C dsp libmfcc.a libmfcc.so
          mkdir -p dsp/dist
          tar -czf "dsp/dist/libmfcc-${{ matrix.host }}.tar.gz" \
              -C dsp/build libmfcc.so libmfcc.a
          cd dsp/dist
          (sha256sum libmfcc-* || shasum -a 256 libmfcc-*) > SHA256SUMS

      - name: Upload workflow artifacts (always, for workflow_dispatch tests)
        uses: actions/upload-artifact@v4
        with:
          name: libmfcc-${{ matrix.host }}
          path: dsp/dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dsp/dist/*
