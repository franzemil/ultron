[project]
name = "ultron"
version = "0.1.0"
description = "Ultron CLI — Spanish voice-actuation car manager"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "pydantic-settings",
    "ultron-model",
    "rich",
    "sounddevice",
    "numpy",
]

[project.scripts]
ultron = "ultron.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = true
sources = { ultron-model = { path = "../model" } }

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ultron"]
